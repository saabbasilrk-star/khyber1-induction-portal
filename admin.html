<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khyber-1 Induction Admin</title>
  <meta name="description" content="Admin portal: progress, screen time and quiz results of every Khyber-1 manager.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">K1</span>
      <div>
        <div class="brand-title">Induction Admin Portal</div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <div class="topbar-right" id="topbarRight" hidden>
      <span class="sync-chip" id="liveState" data-state="local"></span>
      <div class="user-chip" id="adminChip"></div>
      <button class="btn ghost small" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <main id="app" class="container wide"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <footer class="footer"><a href="index.html">← Manager portal</a></footer>

  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="js/content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
